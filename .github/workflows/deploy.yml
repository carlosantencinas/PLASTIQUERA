name: Deploy Plastiqueria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Verify production build
        run: |
          test -f dist/index.html
          grep -q '/PLASTIQUERA/assets/index-' dist/index.html
          ! grep -q 'src/main.js' dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              core.setFailed('El paso de carga no devolvió un artifact_id válido.');
              return;
            }

            const oidcToken = await core.getIDToken();
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: oidcToken,
            });

            const deployment = created.data;
            core.setOutput('page_url', deployment.page_url || '');
            core.info(`Despliegue creado con el artefacto exacto ${artifactId}; ID ${deployment.id}.`);

            const deadline = Date.now() + 600000;
            const terminalFailures = new Set([
              'deployment_failed',
              'deployment_perms_error',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost',
            ]);

            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deploymentId: deployment.id,
              });
              const status = response.data.status;
              core.info(`Estado de GitHub Pages: ${status}`);

              if (status === 'succeed') {
                core.info('GitHub Pages confirmó el despliegue.');
                return;
              }
              if (terminalFailures.has(status)) {
                core.setFailed(`GitHub Pages informó un fallo definitivo: ${status}`);
                return;
              }
            }

            core.setFailed('Se agotaron los 10 minutos de espera para confirmar el despliegue de GitHub Pages.');
