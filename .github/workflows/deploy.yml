name: Deploy Plastiqueria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Verify production build
        run: |
          test -f dist/index.html
          grep -q '/PLASTIQUERA/assets/index-' dist/index.html
          ! grep -q 'src/main.js' dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Remove previous Pages artifacts from reruns
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts.filter(item => item.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -eq 1 ]; then
              echo "El artefacto github-pages está disponible."
              exit 0
            fi
            echo "Esperando indexación del artefacto (intento $attempt/15, encontrados: $count)..."
            sleep 2
          done
          echo "GitHub no expuso un único artefacto github-pages después de 30 segundos."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
